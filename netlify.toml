[build]
  functions = "netlify/functions"
 
[build.environment]
  NODE_VERSION = "18"
 
[functions]
  node_bundler = "esbuild"
 
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
 

# Internal docs live in the repo but must not be served by the site
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true
